name: Exporter regressions

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
      - run: uv sync --locked --python 3.12.13
      - name: Record and verify CPU platform
        run: |
          uv run --locked python - <<'PYTHON'
          import platform
          import torch
          print(platform.platform(), platform.machine(), torch.__version__)
          assert platform.machine() == "arm64"
          assert not torch.cuda.is_available()
          PYTHON
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy .
      - run: uv run --locked pytest -q --strict-markers
